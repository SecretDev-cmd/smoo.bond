name: Check servers

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch: {}      # lets you click "Run workflow" manually on GitHub
  push:
    branches: [ main ]
    paths:
      - 'scripts/check_servers.py'
      - '.github/workflows/check-servers.yml'

permissions:
  contents: write

concurrency:
  group: check-servers
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run server checks
        run: python scripts/check_servers.py

      - name: Commit status.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          if git diff --cached --quiet; then
            echo "No change in status.json"
          else
            git commit -m "Update server status [skip ci]"
            git push
          fi
